[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-briefing-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.110.0",
    "feedparser>=6.0.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "respx>=0.22.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
